name: Pre-2010 price history (on demand)

# Yahoo daily prices for 2006-2010 (fetch_history.py), to extend the backtests to 2007. Commits results/history/.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['fetch_history.py', '.github/workflows/history.yml']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas yfinance
      - run: python fetch_history.py
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/history
          git diff --cached --quiet && exit 0
          git commit -m "$(date -u +%Y-%m-%dT%H:%M) pre-2010 price history"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
