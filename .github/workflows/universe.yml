name: Tech universe (on demand)

# Point-in-time chip + tech universe with daily market caps (build_tech_universe.py): SEC frames share counts,
# SEC submissions for SIC, Yahoo prices. Commits results/universe/.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['build_tech_universe.py', '.github/workflows/universe.yml']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance
      - name: Build
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          SEC_CACHE_TTL_HOURS: '0'
        run: |
          if [ -z "$SEC_UA" ]; then echo "::error::Add the SEC_UA repository secret"; exit 1; fi
          python build_tech_universe.py
      - name: Commit universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/universe
          git diff --cached --quiet && exit 0
          git commit -m "$(date -u +%Y-%m-%dT%H:%M) tech universe"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
