name: Plan alerts (weekdays)

# Daily alerts for the 50/50 QQQ/SMH rotation plan (plan_alerts.py): new rotation buys per sleeve, the PSQ hedge
# action implied by the WU_HEDGE repository variable, the monthly deposit and the January trim/rebalance.
# E-mails when there is something to do, and every Monday. Scheduled runs only fire from the default branch.
on:
  schedule:
    - cron: '23 22 * * 1-5'     # 22:23 UTC, after the US close (17:23/18:23 ET)
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['plan_alerts.py', '.github/workflows/alerts.yml']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance
      - name: Alerts
        env:
          WU_HEDGE: ${{ vars.WU_HEDGE }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python plan_alerts.py
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/plan_alerts.json results/alerts
          git diff --cached --quiet && exit 0
          git commit -m "$(date -u +%Y-%m-%dT%H:%M) plan alerts"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
