name: Plan alerts (weekdays)

# Daily alerts for the plan (plan_alerts.py; rules and setup in docs/PLAN.md): laggard buys per sleeve, the WU hedge
# on/off/top-up (WU_HEDGE variable or TradingView e-mails), the monthly deposit and settlement, the January
# tax/trim/rebalance and margin guardrails. E-mails when there is something to do and every Monday; optional push.
# Scheduled runs only fire from the default branch.
on:
  schedule:
    - cron: '23 22 * * 1-5'     # 22:23 UTC, after the US close (17:23/18:23 ET)
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['plan_alerts.py', '.github/workflows/alerts.yml']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance requests
      # hedge state is private (the repository is public): kept in the workflow cache, never committed
      - name: Restore private state
        uses: actions/cache/restore@v4
        with:
          path: state/private.json
          key: plan-private-${{ github.run_id }}
          restore-keys: plan-private-
      - name: Alerts
        env:
          WU_HEDGE: ${{ vars.WU_HEDGE }}
          ETF_SHARE: ${{ vars.ETF_SHARE }}
          MONTHLY_DEPOSIT: ${{ vars.MONTHLY_DEPOSIT }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          IOFUND_PICKS: ${{ secrets.IOFUND_PICKS }}
          IOFUND_HEDGE: ${{ vars.IOFUND_HEDGE }}
          BREADTH_PARAMS: ${{ secrets.BREADTH_PARAMS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SMS_TO: ${{ secrets.SMS_TO }}
          MAIL_DAILY: ${{ vars.MAIL_DAILY }}
          PUSH_DAILY: ${{ vars.PUSH_DAILY }}
          SMS_DAILY: ${{ vars.SMS_DAILY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python plan_alerts.py
      - name: Save private state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/private.json
          key: plan-private-${{ github.run_id }}
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/plan_alerts.json results/alerts results/breadth/nasdaq_counts.csv
          git diff --cached --quiet && exit 0
          git commit -m "$(date -u +%Y-%m-%dT%H:%M) plan alerts"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
